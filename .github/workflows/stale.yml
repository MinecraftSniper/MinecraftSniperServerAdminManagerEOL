
name: Sync from Gitee (Force)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force sync from Gitee
        run: |
          git remote add gitee https://gitee.com/Minecraft-Sniper/MinecraftSniperServerAdminManagerEOL.git
          git fetch gitee
          git reset --hard gitee/main
          git push origin master --force
